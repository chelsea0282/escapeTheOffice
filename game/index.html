<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escape the Office</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="frame">
      <div class="titlebar">
        <div class="titlebar-left">
          <span class="icon">◼</span>
          <span>Escape the Office</span>
        </div>
        <div class="titlebar-right">
          <span class="dot dot-red"></span>
          <span class="dot dot-yellow"></span>
          <span class="dot dot-green"></span>
        </div>
      </div>

      <div class="workspace">
        <aside class="sidebar">
          <div id="portrait" class="portrait">PHOTO ID</div>
          <div class="stat-card">
            <div class="stat-label">TIME</div>
            <div class="bar"><div id="time-bar" class="bar-fill"></div></div>
            <div id="time-display" class="stat-value">3:50 PM</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">FOCUS</div>
            <div class="bar"><div id="hp-bar" class="bar-fill hp-fill"></div></div>
            <div id="hp-display" class="stat-value">100%</div>
          </div>
        </aside>

        <main class="main-panel">
          <div id="output" class="output"></div>
          <div id="choice-container" class="choice-container hidden"></div>
          <form id="input-form" class="input-form">
            <span class="prompt-symbol">&gt;</span>
            <input id="player-input" type="text" autocomplete="off" placeholder="type your response" />
            <button type="submit">SEND</button>
          </form>
          <button id="restart-button" class="restart-button" type="button">RESTART</button>
        </main>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-card">
        <h1 id="overlay-title">REPLAK.AI</h1>
        <p id="overlay-message">Please authenticate your credentials.</p>
        <form id="overlay-form" class="overlay-form">
          <input id="overlay-input" type="text" autocomplete="off" />
          <button type="submit">SUBMIT</button>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
    <script src="game.js"></script>
  </body>
</html>
