<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escape the Office</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="window-frame">
        <div class="titlebar">
          <div class="titlebar-left">
            <span class="window-icon">▣</span>
            <span class="window-title">Escape the Office</span>
          </div>
          <div class="window-controls" aria-hidden="true">
            <span class="control control-min"></span>
            <span class="control control-max"></span>
            <span class="control control-close"></span>
          </div>
        </div>

        <div class="workspace">
          <aside class="left-panel">
            <div class="portrait-card">
              <div class="portrait-placeholder">worker portrait</div>
              <div class="portrait-name">Jamie</div>
            </div>
          </aside>

          <section class="main-panel">
            <div class="story-wrapper">
              <div class="status-column" aria-label="status bars">
                <div class="status-block">
                  <div class="status-label">Time Left</div>
                  <div class="status-track vertical">
                    <div class="status-fill fill-time"></div>
                  </div>
                  <div id="time-display" class="status-value">4:50 PM</div>
                </div>

                <div class="status-block">
                  <div class="status-label">HP</div>
                  <div class="status-track vertical">
                    <div class="status-fill fill-hp"></div>
                  </div>
                  <div id="legibility-display" class="status-value">0%</div>
                </div>
              </div>

              <div class="story-card">
                <section id="story" class="story" aria-live="polite"></section>
              </div>
            </div>

            <form id="input-form" class="input-row">
              <label for="player-input">&gt;</label>
              <input id="player-input" name="player-input" type="text" autocomplete="off" placeholder="Type what Jamie does..." />
              <button type="submit">Send</button>
            </form>

            <button id="restart-button" class="restart-button" type="button">Restart</button>
          </section>
        </div>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
